name: publish

# Publishes to PyPI on a version tag push (e.g. v2.0.0), using PyPI Trusted
# Publishing (OIDC): no API token stored anywhere. Configure the trusted
# publisher on PyPI first: project mcp-google-ads-safe, owner wvuhskr, repo
# mcp-google-ads-safe, workflow publish.yml, environment pypi.
#
# Nothing is built or uploaded unless the tag equals the version in
# pyproject.toml and the test suite passes on the tagged commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must equal the project version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - name: Tests must pass on the tagged commit
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q -p no:cacheprovider
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
