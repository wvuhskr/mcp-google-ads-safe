name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -p no:cacheprovider
      - name: Bandit (high severity only)
        run: bandit -q -r mcp_google_ads_safe -lll
      - name: Known-vulnerability audit of installed dependencies
        run: pip-audit --skip-editable

  oldest-mcp:
    # Proves the oldest supported MCP SDK. The matrix jobs above install the newest one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the oldest supported mcp
        run: python -m pip install -e ".[dev]" "mcp==1.30.0"
      - name: Test
        run: pytest -q -p no:cacheprovider
      - name: Known-vulnerability audit
        run: pip-audit --skip-editable
